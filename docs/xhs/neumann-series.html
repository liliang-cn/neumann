<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>neumann 拆解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* A teaching card series: every slide is a 1080x1440 (3:4) card for Xiaohongshu.
   One light look everywhere: a pale blue-grey studio around white panels, so the page and the recordings match. */
:root {
  --studio: #E6ECF2; --panel: #FFFFFF; --panel-line: #D3DCE5; --studio-ink: #13212D; --studio-muted: #5F6F7C;
  --paper: #EDF1F5; --card: #FFFFFF; --ink: #0F1C27; --muted: #5A6976;
  --blue: #2350E3; --blue-soft: #DEE6FF;
  --amber: #E09200; --amber-soft: #FFF0C9;
  --red: #D23A3A; --red-soft: #FBDCDC;
  --green: #13865A; --green-soft: #D5F0E3;
  --code: #142230; --code-ink: #DCE6EF;
  --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--studio); color: var(--studio-ink); font-family: var(--sans); font-size: 14px; }
button { font-family: inherit; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; height: 100%; }
.side, .copy { background: var(--panel); border-color: var(--panel-line); overflow-y: auto; padding: 20px 16px; }
.side { border-right: 1px solid var(--panel-line); }
.copy { border-left: 1px solid var(--panel-line); display: grid; align-content: start; gap: 14px; }
.brand { font: 900 20px var(--sans); margin: 0 0 4px; }
.brand-sub { color: var(--studio-muted); font-size: 12px; margin: 0 0 18px; line-height: 1.5; }
.eps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.eps button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--studio-muted); padding: 8px 10px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 6px; font-size: 14px; line-height: 1.4; }
.eps button:hover { color: var(--studio-ink); background: #EEF2F6; }
.eps button[aria-current="true"] { color: var(--blue); background: var(--blue-soft); font-weight: 700; }
.eps .no { font: 700 12px var(--mono); padding-top: 2px; }

.main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; padding: 16px; gap: 12px; }
.stagewrap { min-height: 0; display: grid; place-items: center; }
.frame { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 6px 30px rgba(30,50,70,.16); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.ctl { background: var(--panel); color: var(--studio-ink); border: 1px solid var(--panel-line); border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; min-height: 40px; }
.ctl:hover { border-color: var(--studio-muted); }
.ctl.primary { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
.where { color: var(--studio-muted); font: 500 12px var(--mono); min-width: 110px; text-align: center; }

.copy h2 { font: 700 15px var(--sans); margin: 0; }
.copy .hint { color: var(--studio-muted); font-size: 12px; line-height: 1.6; margin: 0; }
.field { display: grid; gap: 6px; }
.field .lab { display: flex; justify-content: space-between; align-items: center; color: var(--studio-muted); font-size: 12px; }
.field pre { margin: 0; white-space: pre-wrap; word-break: break-word; background: #F4F7FA; border: 1px solid var(--panel-line); border-radius: 8px; padding: 10px 12px; font: 14px/1.7 var(--sans); color: var(--studio-ink); }
.mini { background: var(--panel); min-height: 30px; border: 1px solid var(--panel-line); color: var(--studio-ink); border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; }
.cmd { font: 12px/1.6 var(--mono); color: var(--studio-muted); background: #F4F7FA; white-space: pre-wrap; border: 1px dashed var(--panel-line); border-radius: 8px; padding: 8px 10px; word-break: break-all; }

/* ---------- the card: 1080 x 1440 ---------- */
.card { position: absolute; left: 0; top: 0; width: 1080px; height: 1440px; transform-origin: 0 0; background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }
.card .kick { position: absolute; left: 64px; top: 50px; font: 700 34px var(--mono); color: var(--blue); letter-spacing: .02em; }
.card .ttl { position: absolute; left: 56px; right: 56px; top: 100px; margin: 0; font: 900 64px/1.14 var(--sans); letter-spacing: -.01em; text-wrap: balance; }
.card svg.stage { position: absolute; left: 0; top: 270px; width: 1080px; height: 870px; overflow: visible; }
.card .say { position: absolute; left: 40px; right: 40px; top: 1150px; height: 210px; background: var(--card); border-radius: 26px; padding: 20px 34px; font: 500 43px/1.42 var(--sans); overflow: hidden; display: flex; align-items: center; }
.card .say span { display: block; transition: opacity .35s; }
.card .foot { position: absolute; left: 64px; right: 64px; top: 1376px; display: flex; justify-content: space-between; align-items: center; font: 500 24px var(--mono); color: var(--muted); }
.card .dots { display: flex; gap: 8px; }
.card .dots i { width: 34px; height: 8px; border-radius: 4px; background: #C9D3DC; }
.card .dots i.on { background: var(--blue); }
.card .stamp { position: absolute; left: 50%; top: 640px; transform: translate(-50%, -50%) rotate(-7deg) scale(.6); font: 900 150px var(--mono); color: var(--red); border: 12px solid var(--red); border-radius: 26px; padding: 6px 40px; opacity: 0; pointer-events: none; background: rgba(255,255,255,.75); }
.card .stamp.go { animation: stamp 1.9s ease-out forwards; }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-7deg) scale(1.6); } 15% { opacity: 1; transform: translate(-50%,-50%) rotate(-7deg) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }

/* svg primitives */
.box rect.body { fill: var(--card); stroke: var(--ink); stroke-width: 3; transition: fill .4s, stroke .4s, stroke-width .3s; }
.box text.t { font: 700 34px var(--sans); fill: var(--ink); }
.box text.s { font: 400 23px var(--sans); fill: var(--muted); }
.box.k-core rect.body { fill: var(--blue-soft); stroke: var(--blue); }
.box.k-store rect.body { fill: #E3EAF1; }
.box.k-store line.lid { stroke: var(--ink); stroke-width: 2; opacity: .5; }
.box.k-ext rect.body { stroke-dasharray: 12 8; }
.box.k-dev rect.body { fill: var(--amber-soft); stroke: #8A6200; }
.box.k-good rect.body { fill: var(--green-soft); stroke: var(--green); }
.box.k-bad rect.body { fill: var(--red-soft); stroke: var(--red); }
.box.k-plain rect.body { fill: #E2E8EE; stroke: #9AA8B4; }
.box.k-note rect.body { fill: transparent; stroke: none; }
.box.k-note text.t { font-weight: 900; }
.box.k-code rect.body { fill: var(--code); stroke: none; }
.box.k-code text.t { font: 500 30px var(--mono); fill: var(--code-ink); }
.box.k-code text.s { font: 500 22px var(--mono); fill: #8EA2B5; }
.box.mono text.t { font-family: var(--mono); font-weight: 700; }
.box.on rect.body { stroke: var(--blue); stroke-width: 7; }
.box.on.k-code rect.body { fill: #1F3A5C; stroke: none; }
.box.hot rect.body { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 7; }
.box.hot.k-code rect.body { fill: #4A3A10; }
.box.sgood rect.body { fill: var(--green-soft); stroke: var(--green); stroke-width: 7; }
.box.sbad rect.body { fill: var(--red-soft); stroke: var(--red); stroke-width: 7; }
.el { transition: opacity .5s; }
.el.gone { opacity: 0; }
.el.dim { opacity: .18; }
.edge { fill: none; stroke: #8796A3; stroke-width: 3.5; transition: stroke .3s; }
.edge.dash { stroke-dasharray: 10 8; }
.edge.hot { stroke: var(--blue); }
.ah { fill: #8796A3; }
.elab { font: 500 27px var(--sans); fill: var(--muted); paint-order: stroke; stroke: var(--paper); stroke-width: 8px; stroke-linejoin: round; }
.pk { fill: var(--blue); }
.pk.c-hot { fill: var(--amber); } .pk.c-bad { fill: var(--red); } .pk.c-good { fill: var(--green); }
.pkh { fill: var(--blue); opacity: .25; }
.pkh.c-hot { fill: var(--amber); } .pkh.c-bad { fill: var(--red); } .pkh.c-good { fill: var(--green); }
.tok { transition: transform .95s cubic-bezier(.6,.05,.3,1); }
.tok rect { fill: var(--ink); }
.tok text { font: 700 31px var(--mono); fill: #FFFFFF; }
.txt { font: 500 26px var(--sans); fill: var(--muted); }
.plot .axis { stroke: var(--ink); stroke-width: 3; fill: none; }
.plot .grid { stroke: #CDD6DE; stroke-width: 1.5; }
.plot .line { stroke: var(--blue); stroke-width: 6; fill: none; stroke-linejoin: round; stroke-linecap: round; transition: stroke-dashoffset 1.3s ease; }
.plot .lab { font: 500 29px var(--mono); fill: var(--muted); }
.instant, .instant * { transition: none !important; }

/* record / still: only the card, fitted to the window */
body.rec .app { grid-template-columns: 1fr; }
body.rec .side, body.rec .copy, body.rec .controls { display: none; }
body.rec .main { padding: 0; grid-template-rows: 1fr; height: 100vh; height: 100dvh; }
body.rec .app { height: 100vh; height: 100dvh; }
body.rec { background: var(--paper); }
body.rec .frame { border-radius: 0; box-shadow: none; }

/* default continuous mode: card + table of contents */
.tocbtn { display: none; }
.slides { list-style: none; margin: 2px 0 8px 34px; padding: 0; display: grid; gap: 1px; }
.slides button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--studio-muted); padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1.45; display: grid; grid-template-columns: 22px 1fr; }
.slides button:hover { color: var(--studio-ink); background: #EEF2F6; }
.slides button[aria-current="true"] { color: var(--ink); background: var(--amber-soft); font-weight: 700; }
.slides .sn { font: 500 11px var(--mono); padding-top: 2px; }
body.loop { background: var(--studio); }
body.loop .app { grid-template-columns: 300px minmax(0, 1fr); height: 100vh; height: 100dvh; }
body.loop .copy, body.loop .controls { display: none; }
body.loop .main { grid-template-rows: 1fr; padding: 16px; height: 100vh; height: 100dvh; }
body.loop .side { height: 100vh; height: 100dvh; }
@media (max-width: 900px) {
  body.loop .app { grid-template-columns: minmax(0, 1fr); }
  body.loop .main { padding: 8px; }
  body.loop .side { position: fixed; inset: 0 auto 0 0; width: min(86vw, 340px); z-index: 20; transform: translateX(-102%); transition: transform .3s ease; box-shadow: 0 0 40px rgba(20,40,60,.25); padding-top: calc(66px + env(safe-area-inset-top, 0px)); }
  body.loop.tocopen .side { transform: none; }
  body.loop .tocbtn { display: block; position: fixed; z-index: 30; top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; background: var(--panel); color: var(--studio-ink); border: 1px solid var(--panel-line); border-radius: 22px; padding: 9px 16px; font-size: 15px; font-weight: 700; box-shadow: 0 4px 16px rgba(20,40,60,.15); min-height: 44px; }
  body.loop .scrim { position: fixed; inset: 0; background: rgba(20,35,50,.28); z-index: 15; }
}

@media (max-width: 1180px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .side { border: 0; border-bottom: 1px solid var(--panel-line); padding: 12px 16px; position: sticky; top: 0; z-index: 5; }
  .brand-sub { display: none; }
  .brand { font-size: 17px; margin-bottom: 8px; }
  .eps { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .eps::-webkit-scrollbar { display: none; }
  body.loop .eps { display: grid; overflow: visible; }
  body.loop .eps button { white-space: normal; border: 0; grid-template-columns: 28px 1fr; }
  .eps li { flex: 0 0 auto; }
  .eps button { grid-template-columns: auto auto; white-space: nowrap; border: 1px solid var(--panel-line); padding: 8px 12px; min-height: 40px; }
  .main { grid-template-rows: auto auto; padding: 12px 16px; }
  .controls { position: sticky; bottom: 0; z-index: 5; background: rgba(230,236,242,.94); backdrop-filter: blur(8px); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
  .where { order: -1; width: 100%; }
  .copy { border: 0; border-top: 1px solid var(--panel-line); padding: 18px 16px 32px; }
}
@media (max-width: 520px) {
  .ctl { padding: 8px 10px; font-size: 13px; }
  #rec, #speed { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .tok, .plot .line, .el, .box rect.body { transition: none; }
}
</style>
</head>
<body>
<button class="tocbtn" id="tocbtn" aria-expanded="false" aria-controls="side">目录</button>
<div class="scrim" id="scrim" hidden></div>
<div class="app">
  <nav class="side" id="side" aria-label="目录">
    <p class="brand">neumann 拆解</p>
    <p class="brand-sub">一个按冯·诺依曼计算机组织的 Go Agent 运行时。每页是一张 1080×1440 的卡片。手机上左右滑动翻页。</p>
    <ol class="eps" id="eps"></ol>
  </nav>

  <main class="main">
    <div class="stagewrap" id="stagewrap">
      <div class="frame" id="frame">
        <div class="card" id="card">
          <div class="kick" id="kick"></div>
          <h1 class="ttl" id="ttl"></h1>
          <svg class="stage" id="stage" viewBox="0 0 1080 870" aria-hidden="true"></svg>
          <div class="say"><span id="say"></span></div>
          <div class="foot"><span>neumann · Go 写的 Agent 运行时</span><span class="dots" id="dots"></span><span id="page"></span></div>
          <div class="stamp" id="stamp"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="ctl" id="prev">上一页</button>
      <button class="ctl primary" id="play">暂停</button>
      <button class="ctl" id="next">下一页</button>
      <span class="where" id="where"></span>
      <button class="ctl" id="still" title="跳到这一页的最终状态，用来截图做图文">定格</button>
      <button class="ctl" id="replay">重放本页</button>
      <button class="ctl" id="speed">1×</button>
      <button class="ctl" id="rec" title="只留卡片，从第一页自动播完整集，用来录屏">录制模式</button>
    </div>
  </main>

  <aside class="copy" aria-label="笔记文案">
    <h2>这一集的笔记文案</h2>
    <p class="hint">正文里不放链接。话题在小红书里逐个输入：每个 # 前先打空格，等联想出来再回车。</p>
    <div class="field"><div class="lab"><span>标题</span><button class="mini" data-copy="c-title">复制</button></div><pre id="c-title"></pre></div>
    <div class="field"><div class="lab"><span>正文</span><button class="mini" data-copy="c-body">复制</button></div><pre id="c-body"></pre></div>
    <div class="field"><div class="lab"><span>话题</span><button class="mini" data-copy="c-tags">复制</button></div><pre id="c-tags"></pre></div>
    <div class="field"><div class="lab"><span>录屏 / 截图用的地址参数</span></div><div class="cmd" id="c-urls"></div></div>
  </aside>
</div>

<script>
(() => {
'use strict';
// ------------------------------------------------------------------ authoring helpers
const B = (id, x, y, w, h, t, s = '', k = '', o = {}) => ({ type: 'box', id, x, y, w, h, t, s, k, ...o });
const E = (id, a, b, o = {}) => ({ type: 'edge', id, a, b, ...o });
const T = (id, at, label, o = {}) => ({ type: 'token', id, at, label, ...o });
const X = (id, x, y, t, o = {}) => ({ type: 'text', id, x, y, t, ...o });
const P = (id, x, y, w, h, vals, max, o = {}) => ({ type: 'plot', id, x, y, w, h, vals, max, ...o });
const range = (p, a, b) => Array.from({ length: b - a + 1 }, (_, i) => p + (a + i));

// a two-column table: left term -> right meaning
function table(items, o = {}) {
  const y0 = o.y0 ?? 10, h = o.h ?? 70, gap = o.gap ?? 8, lw = o.lw ?? 330, lx = 40, rx = lx + lw + 40, rw = 1040 - rx;
  const els = [];
  items.forEach(([l, r, rs = ''], i) => {
    const y = y0 + i * (h + gap);
    els.push(B('l' + (i + 1), lx, y, lw, h, l, '', o.lk ?? 'plain', { hidden: !o.shown, ts: o.lts ?? 30 }));
    els.push(B('r' + (i + 1), rx, y, rw, h, r, rs, o.rk ?? 'core', { hidden: !o.shown, ts: o.rts ?? 30, ss: o.rss ?? 22 }));
    els.push(E('a' + (i + 1), 'l' + (i + 1), 'r' + (i + 1), { hidden: !o.shown }));
  });
  return els;
}
const both = (...ns) => ns.flatMap(n => ['l' + n, 'r' + n, 'a' + n]);
// a vertical list of full-width rows
function rows(items, o = {}) {
  const y0 = o.y0 ?? 10, h = o.h ?? 100, gap = o.gap ?? 18, x = o.x ?? 40, w = o.w ?? 1000;
  const els = items.map(([t, s, k = '', extra = {}], i) =>
    B('r' + (i + 1), x, y0 + i * (h + gap), w, h, t, s, k, { hidden: !!o.hidden, ...extra }));
  if (o.edges) for (let i = 1; i < items.length; i++) els.push(E('e' + i, 'r' + i, 'r' + (i + 1), { hidden: !!o.hidden }));
  return els;
}

// ------------------------------------------------------------------ the series
const EP = [
// ============================================================ 01
{ title: '把 Agent 做成一台计算机',
  copy: {
    title: '把 Agent 做成一台计算机',
    body: `我用 Go 写了一个常驻的 Agent 运行时，叫 neumann。结构照着冯·诺依曼计算机来：

· vCore 是核心，一条指令就是一次模型调用
· 每个任务有一个 TCB，发给模型的消息就是寄存器
· 工具挂在总线上，异步执行，做完发中断
· 所有状态提交进持久化存储：先提交，后动作

这个系列一集拆一块，每一集都对着源码讲。第一集先看整台机器长什么样、一个任务怎么从提交走到完成。`,
    tags: '#Go语言 #AIAgent #大模型应用 #后端开发 #程序员 #系统设计 #计算机组成原理'
  },
  slides: [
  { title: '一个按计算机组织的 Agent 运行时',
    scene: [
      B('io', 40, 10, 1000, 100, '协议端口', 'Instruction 进 · Event 出', 'ext'),
      B('sched', 40, 180, 290, 150, '调度器', '就绪队列\n等待集合'),
      B('v1', 370, 180, 210, 150, 'vCore 1', '取指·执行·提交', 'core', { ts: 32, ss: 21 }),
      B('v2', 600, 180, 210, 150, 'vCore 2', '取指·执行·提交', 'core', { ts: 32, ss: 21 }),
      B('v3', 830, 180, 210, 150, 'vCore 3', '取指·执行·提交', 'core', { ts: 32, ss: 21 }),
      B('model', 40, 410, 480, 120, '模型服务商', 'OpenAI 兼容 · Anthropic', 'ext'),
      B('bus', 560, 410, 480, 120, '总线', '页表 · 仲裁 · L2 缓存'),
      B('d1', 560, 590, 150, 90, 'builtin', '', 'dev', { ts: 28 }),
      B('d2', 725, 590, 150, 90, 'MCP', '', 'dev', { ts: 28 }),
      B('d3', 890, 590, 150, 90, 'skills', '', 'dev', { ts: 28 }),
      B('mem', 40, 750, 1000, 100, '持久化存储', 'TCB · 调用记录 · 中断 · 事件，同一个事务', 'store'),
      E('in', 'io', 'sched'), E('s1', 'sched', 'v1'), E('vm', 'v1', 'model'), E('vb', 'v3', 'bus'),
      E('b1', 'bus', 'd1'), E('b2', 'bus', 'd2'), E('b3', 'bus', 'd3'),
      E('mm', 'model', 'mem'), E('dm', 'd2', 'mem'),
      E('out', 'mem', 'io', { d: 'M40 800 C6 800, 6 60, 40 60' })
    ],
    beats: [
      { on: ['io'], send: ['in'], say: 'neumann 是一个用 Go 写的常驻 Agent 运行时。外部只用两种结构和它交换：Instruction 进，Event 出。' },
      { on: ['sched', 'v1', 'v2', 'v3'], send: ['s1'], say: '调度器管排队，vCore 干活。vCore 是一个 goroutine，不停地取指、执行、提交。' },
      { on: ['v1', 'model'], send: ['vm', { e: 'vm', rev: true, delay: 900 }], say: '一条指令就是一次模型调用。每个服务商是一个执行组，组里的 vCore 数随负载伸缩。' },
      { on: ['bus', 'd1', 'd2', 'd3'], send: ['vb', { e: 'b1', delay: 800 }, { e: 'b2', delay: 800 }], say: '工具像外设，挂在总线上。工具调用异步执行，做完用中断唤醒任务，慢工具不占核心。' },

      { show: ['r2'], on: ['r2'], say: '真实模型跑到一半 SIGKILL，3 次全过，有副作用的工具只执行了一次。' },
      { show: ['r3'], on: ['r3'], say: '200 个任务同时打网关，全部完成，计费账一分不差。' },
      { show: ['r4'], on: ['r4'], say: '同一套 45 道 agent 题跑两遍，neumann 85/90，对照实现 83/90，每题 token 只多 2.8%。' },
      { show: ['r5'], hot: ['r5'], say: '还没验到的也说清楚：过载减半在真实网关上还没触发过，需要一个会限并发的端点。' }
    ] }
  ] }
];

// ------------------------------------------------------------------ rendering
const NS = 'http://www.w3.org/2000/svg';
const FS = 1.22; // every in-card size is scaled up so cards stay readable on a phone screen
const $ = s => document.querySelector(s);
const svg = $('#stage'), card = $('#card');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const qs = new URLSearchParams(location.search);
const REC = qs.has('rec'), STILL = qs.has('still'), STUDIO = qs.has('studio');
// default: one continuous animation through every episode, card only, no controls
const LOOP = !REC && !STILL && !STUDIO;
if (REC || STILL) document.body.classList.add('rec');
if (LOOP) document.body.classList.add('loop');

let ep = clamp((+qs.get('ep') || 1) - 1, 0, EP.length - 1);
let sl = clamp((+qs.get('s') || 1) - 1, 0, EP[ep].slides.length - 1);
let playing = !STILL, speed = 1, gen = 0, waiters = [];
let els = {};

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mk(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const center = b => [b.x + b.w / 2, b.y + b.h / 2];
function clip(b, px, py, pad = 6) {
  const [cx, cy] = center(b), dx = px - cx, dy = py - cy;
  if (!dx && !dy) return [cx, cy];
  const s = Math.min(dx ? (b.w / 2 + pad) / Math.abs(dx) : Infinity, dy ? (b.h / 2 + pad) / Math.abs(dy) : Infinity);
  return [cx + dx * s, cy + dy * s];
}
function fit(textEl, max) {
  const len = textEl.getComputedTextLength();
  if (len > max) {
    const fs = parseFloat(getComputedStyle(textEl).fontSize);
    textEl.style.fontSize = Math.max(14, fs * max / len) + 'px';
  }
}

function build(slide) {
  svg.innerHTML = '';
  els = {};
  const defs = mk('defs', {}, svg);
  const m = mk('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);
  mk('path', { d: 'M0 0 L10 5 L0 10 z', class: 'ah' }, m);
  const gEdges = mk('g', {}, svg), gBoxes = mk('g', {}, svg), gTop = mk('g', {}, svg);
  const boxes = {};
  slide.scene.filter(d => d.type === 'box').forEach(d => boxes[d.id] = d);

  for (const d of slide.scene) {
    if (d.type === 'box') {
      const g = mk('g', { class: `el box k-${d.k || 'plain0'} ${d.cls || ''}` }, gBoxes);
      if (!d.k) g.classList.remove('k-plain0');
      mk('rect', { class: 'body', x: d.x, y: d.y, width: d.w, height: d.h, rx: d.k === 'code' ? 0 : 18 }, g);
      const tl = String(d.t).split('\n'), sll = d.s ? String(d.s).split('\n') : [];
      let ts = (d.ts || (d.k === 'code' ? 30 : 34)) * FS, ss = (d.ss || 23) * FS;
      let total = tl.length * ts * 1.22 + (sll.length ? 10 + sll.length * ss * 1.4 : 0);
      if (total > d.h - 14) { const k = (d.h - 14) / total; ts *= k; ss *= k; total = d.h - 14; }
      let y = d.y + d.h / 2 - total / 2;
      const left = d.align === 'left';
      const x = left ? d.x + 30 : d.x + d.w / 2;
      for (const line of tl) {
        y += ts * 1.22;
        const t = mk('text', { class: 't', x, y: y - ts * .28, 'text-anchor': left ? 'start' : 'middle' }, g);
        t.style.fontSize = ts + 'px';
        t.textContent = line;
      }
      if (sll.length) y += 10;
      for (const line of sll) {
        y += ss * 1.4;
        const t = mk('text', { class: 's', x, y: y - ss * .38, 'text-anchor': left ? 'start' : 'middle' }, g);
        t.style.fontSize = ss + 'px';
        t.textContent = line;
      }
      els[d.id] = { d, el: g };
    } else if (d.type === 'edge') {
      const a = boxes[d.a], b = boxes[d.b];
      let path = d.d, mid;
      if (!path) {
        const ca = center(a), cb = center(b);
        if (d.bend) {
          const mx = (ca[0] + cb[0]) / 2, my = (ca[1] + cb[1]) / 2, dx = cb[0] - ca[0], dy = cb[1] - ca[1], L = Math.hypot(dx, dy);
          const c = [mx - dy / L * d.bend, my + dx / L * d.bend];
          const s = clip(a, c[0], c[1]), e = clip(b, c[0], c[1]);
          path = `M${s[0]} ${s[1]} Q${c[0]} ${c[1]} ${e[0]} ${e[1]}`;
        } else {
          const s = clip(a, cb[0], cb[1]), e = clip(b, ca[0], ca[1]);
          path = `M${s[0]} ${s[1]} L${e[0]} ${e[1]}`;
        }
      }
      const g = mk('g', { class: 'el' }, gEdges);
      const p = mk('path', { class: 'edge' + (d.dash ? ' dash' : ''), d: path, 'marker-end': 'url(#ah)' }, g);
      if (d.label) {
        const L = p.getTotalLength(), pt = p.getPointAtLength(L / 2);
        const t = mk('text', { class: 'elab', x: pt.x, y: pt.y - 14, 'text-anchor': 'middle' }, g);
        t.textContent = d.label;
      }
      els[d.id] = { d, el: g, path: p };
    } else if (d.type === 'text') {
      const t = mk('text', { class: 'el txt', x: d.x, y: d.y, 'text-anchor': d.anchor || 'middle' }, gBoxes);
      t.style.fontSize = (d.size || 26) * FS + 'px';
      if (d.mono) t.style.fontFamily = 'var(--mono)';
      if (d.ink) { t.style.fill = 'var(--ink)'; t.style.fontWeight = 700; }
      t.textContent = d.t;
      els[d.id] = { d, el: t };
    } else if (d.type === 'plot') {
      const g = mk('g', { class: 'el plot' }, gBoxes);
      for (let k = 1; k <= 3; k++) mk('line', { class: 'grid', x1: d.x, x2: d.x + d.w, y1: d.y + d.h - d.h * k / 3, y2: d.y + d.h - d.h * k / 3 }, g);
      mk('path', { class: 'axis', d: `M${d.x} ${d.y} L${d.x} ${d.y + d.h} L${d.x + d.w} ${d.y + d.h}` }, g);
      const pts = d.vals.map((v, i) => [d.x + d.w * i / (d.vals.length - 1), d.y + d.h - d.h * v / d.max]);
      const line = mk('path', { class: 'line', d: 'M' + pts.map(p => p.join(' ')).join(' L') }, g);
      const L = line.getTotalLength();
      line.style.strokeDasharray = L; line.style.strokeDashoffset = L;
      const yl = mk('text', { class: 'lab', x: d.x - 16, y: d.y + 20, 'text-anchor': 'end' }, g); yl.textContent = d.yl || '';
      const xl = mk('text', { class: 'lab', x: d.x + d.w, y: d.y + d.h + 40, 'text-anchor': 'end' }, g); xl.textContent = d.xl || '';
      els[d.id] = { d, el: g, line, L };
      for (const mkr of d.marks || []) {
        const [px, py] = pts[mkr.i];
        const mg = mk('g', { class: 'el gone' }, g);
        mk('circle', { cx: px, cy: py, r: 11, fill: 'var(--amber)' }, mg);
        const t = mk('text', { class: 'lab', x: px + (mkr.dx ?? 18), y: py + (mkr.dy ?? 46), 'text-anchor': mkr.anchor || 'start' }, mg);
        t.style.fill = 'var(--ink)'; t.style.fontWeight = 700;
        t.textContent = mkr.t;
        els[mkr.id] = { d: mkr, el: mg };
      }
    }
  }
  for (const d of slide.scene) {
    if (d.type !== 'token') continue;
    const g = mk('g', { class: 'tok' }, gTop);
    const r = mk('rect', { rx: 30, height: 60, y: -30 }, g);
    const t = mk('text', { y: 11, 'text-anchor': 'middle' }, g);
    t.textContent = d.label;
    const w = t.getComputedTextLength() + 44;
    r.setAttribute('width', w); r.setAttribute('x', -w / 2);
    els[d.id] = { d, el: g, boxes };
    placeToken(d.id, d.at);
  }
  // fit text inside boxes
  for (const id in els) {
    const it = els[id];
    if (it.d.type !== 'box') continue;
    it.el.querySelectorAll('text').forEach(t => fit(t, it.d.w - (it.d.align === 'left' ? 50 : 32)));
  }
  for (const d of slide.scene) if (d.hidden) els[d.id].el.classList.add('gone');
}

function placeToken(id, at) {
  const it = els[id];
  let x, y;
  if (Array.isArray(at)) [x, y] = at;
  else { const b = it.boxes[at]; [x, y] = [b.x + b.w / 2, b.y + b.h]; }
  it.el.style.transform = `translate(${x}px, ${y}px)`;
}

const STATES = ['on', 'hot', 'sgood', 'sbad'];
function applyPersistent(b) {
  for (const id of b.show || []) els[id] && els[id].el.classList.remove('gone');
  for (const id of b.hide || []) els[id] && els[id].el.classList.add('gone');
  for (const id of b.dim || []) els[id] && els[id].el.classList.add('dim');
  for (const id of b.undim || []) els[id] && els[id].el.classList.remove('dim');
  for (const id in b.set || {}) {
    const it = els[id]; if (!it) continue;
    const s = it.el.querySelector('text.s'); if (s) s.textContent = b.set[id];
  }
  for (const [id, at] of b.move || []) placeToken(id, at);
  if (b.plot) { const it = els[b.plot[0]]; it.line.style.strokeDashoffset = it.L * (1 - b.plot[1]); }
}
function applyHighlight(b) {
  for (const id in els) if (els[id].d.type === 'box') els[id].el.classList.remove(...STATES);
  const add = (ids, c) => (ids || []).forEach(id => els[id] && els[id].el.classList.add(c));
  add(b.on, 'on'); add(b.hot, 'hot'); add(b.good, 'sgood'); add(b.bad, 'sbad');
}
function fitSay() {
  const s = $('#say'), box = s.parentElement;
  let fs = 43; s.style.fontSize = fs + 'px';
  while (s.scrollHeight > box.clientHeight - 40 && fs > 30) { fs -= 1; s.style.fontSize = fs + 'px'; }
}
function setSay(text) {
  const s = $('#say');
  s.style.opacity = 0;
  setTimeout(() => { s.textContent = text || ''; fitSay(); s.style.opacity = 1; }, reduce ? 0 : 180);
}

const sleep = ms => new Promise(r => setTimeout(r, ms / speed));
function packet(spec, g) {
  const o = typeof spec === 'string' ? { e: spec } : spec;
  const it = els[o.e]; if (!it || !it.path) return Promise.resolve();
  return sleep(o.delay || 0).then(() => new Promise(res => {
    if (g !== gen) return res();
    const p = it.path, L = p.getTotalLength();
    const halo = mk('circle', { r: 22, class: 'pkh ' + (o.c ? 'c-' + o.c : '') }, svg);
    const dot = mk('circle', { r: 11, class: 'pk ' + (o.c ? 'c-' + o.c : '') }, svg);
    p.classList.add('hot');
    const dur = (reduce ? 1 : Math.min(1300, Math.max(650, L * 2.1))) / speed, t0 = performance.now();
    const step = now => {
      if (g !== gen) { halo.remove(); dot.remove(); return res(); }
      const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const pt = p.getPointAtLength((o.rev ? 1 - e : e) * L);
      for (const c of [halo, dot]) { c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); }
      if (k < 1) requestAnimationFrame(step);
      else { setTimeout(() => { halo.remove(); dot.remove(); p.classList.remove('hot'); }, 250); res(); }
    };
    requestAnimationFrame(step);
  }));
}
function stamp(text) {
  const s = $('#stamp'); s.textContent = text; s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
}

async function runBeat(b, g) {
  setSay(b.say);
  if (b.stamp) stamp(b.stamp);
  applyPersistent(b);
  applyHighlight(b);
  await Promise.all((b.send || []).map(s => packet(s, g)));
  if (g !== gen) return;
  const read = b.say ? Math.min(7500, Math.max(2600, b.say.length * 125)) : 1500;
  await sleep(read);
}

function finalState(slide) {
  card.classList.add('instant');
  slide.beats.forEach(applyPersistent);
  const last = slide.beats[slide.beats.length - 1];
  applyHighlight(last);
  $('#say').textContent = last.say || '';
  fitSay();
  $('#say').style.opacity = 1;
  if (!STILL) requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('instant')));
}

function chrome() {
  const e = EP[ep], s = e.slides[sl];
  $('#kick').textContent = `neumann 拆解 · ${String(ep + 1).padStart(2, '0')}`;
  $('#ttl').textContent = s.title;
  $('#page').textContent = `${sl + 1} / ${e.slides.length}`;
  $('#dots').innerHTML = e.slides.map((_, i) => `<i class="${i === sl ? 'on' : ''}"></i>`).join('');
  $('#where').textContent = `第 ${ep + 1} 集 · ${sl + 1}/${e.slides.length}`;
  document.querySelectorAll('#eps button.ep').forEach((bt, i) => bt.setAttribute('aria-current', String(i === ep)));
  document.querySelectorAll('#eps .slides button').forEach(bt => {
    const cur = +bt.dataset.ep === ep && +bt.dataset.sl === sl;
    bt.setAttribute('aria-current', String(cur));
    if (cur) { const side = $('#side'), r = bt.getBoundingClientRect(), sr = side.getBoundingClientRect();
      if (r.top < sr.top + 60 || r.bottom > sr.bottom - 20) side.scrollTop += r.top - sr.top - sr.height / 3; }
  });
  $('#c-title').textContent = e.copy.title;
  $('#c-body').textContent = e.copy.body;
  $('#c-tags').textContent = e.copy.tags;
  const base = location.pathname.split('/').pop();
  $('#c-urls').textContent = `连续播放全部：${base}\n录一集：${base}?ep=${ep + 1}&rec=1\n截这一页：${base}?ep=${ep + 1}&s=${sl + 1}&still=1`;
}

async function show(g) {
  const slide = EP[ep].slides[sl];
  chrome();
  card.classList.add('instant');
  build(slide);
  $('#say').textContent = '';
  if (!STILL) requestAnimationFrame(() => card.classList.remove('instant'));
  window.__ready = true;
  if (STILL) { finalState(slide); window.__done = true; return; }
  for (let i = 0; i < slide.beats.length; i++) {
    if (!playing) { await new Promise(r => waiters.push(r)); }
    if (g !== gen) return;
    await runBeat(slide.beats[i], g);
    if (g !== gen) return;
  }
  await sleep(900);
  if (g !== gen) return;
  if (!playing) { await new Promise(r => waiters.push(r)); if (g !== gen) return; }
  if (sl < EP[ep].slides.length - 1) { sl++; start(); }
  else if (LOOP) { ep = (ep + 1) % EP.length; sl = 0; start(); }
  else { window.__done = true; if (!REC) { playing = false; syncPlay(); } }
}
function start() { gen++; const w = waiters; waiters = []; w.forEach(f => f()); show(gen); }
function syncPlay() { $('#play').textContent = playing ? '暂停' : '播放'; }

// ------------------------------------------------------------------ layout & controls
function layout() {
  const wrap = $('#stagewrap'), frame = $('#frame');
  const rec = REC || STILL, stacked = STUDIO && window.innerWidth <= 1180;
  const W = rec ? window.innerWidth : wrap.clientWidth;
  const H = rec ? window.innerHeight : stacked ? window.innerHeight - 170 : (wrap.clientHeight || window.innerHeight);
  const s = Math.min(W / 1080, Math.max(H, 320) / 1440);
  frame.style.width = 1080 * s + 'px'; frame.style.height = 1440 * s + 'px';
  card.style.transform = `scale(${s})`;
}
new ResizeObserver(layout).observe($('#stagewrap'));
window.addEventListener('resize', layout);

function jump(i, j) {
  ep = i; sl = j; playing = true; syncPlay(); closeToc(); start();
}
EP.forEach((e, i) => {
  const li = document.createElement('li');
  const bt = document.createElement('button');
  bt.className = 'ep';
  bt.innerHTML = `<span class="no">${String(i + 1).padStart(2, '0')}</span><span></span>`;
  bt.lastChild.textContent = e.title;
  bt.addEventListener('click', () => jump(i, 0));
  li.appendChild(bt);
  if (!STUDIO) {
    const ol = document.createElement('ol');
    ol.className = 'slides';
    e.slides.forEach((s, j) => {
      const sli = document.createElement('li');
      const sb = document.createElement('button');
      sb.dataset.ep = i; sb.dataset.sl = j;
      sb.innerHTML = `<span class="sn">${j + 1}</span><span></span>`;
      sb.lastChild.textContent = s.title;
      sb.addEventListener('click', () => jump(i, j));
      sli.appendChild(sb); ol.appendChild(sli);
    });
    li.appendChild(ol);
  }
  $('#eps').appendChild(li);
});
function openToc() { document.body.classList.add('tocopen'); $('#scrim').hidden = false; $('#tocbtn').setAttribute('aria-expanded', 'true'); $('#tocbtn').textContent = '关闭'; }
function closeToc() { document.body.classList.remove('tocopen'); $('#scrim').hidden = true; $('#tocbtn').setAttribute('aria-expanded', 'false'); $('#tocbtn').textContent = '目录'; }
$('#tocbtn').addEventListener('click', () => document.body.classList.contains('tocopen') ? closeToc() : openToc());
$('#scrim').addEventListener('click', closeToc);
$('#play').addEventListener('click', () => {
  playing = !playing; syncPlay();
  if (playing) { const w = waiters; waiters = []; w.forEach(f => f()); }
});
$('#next').addEventListener('click', () => {
  if (sl < EP[ep].slides.length - 1) sl++; else if (ep < EP.length - 1) { ep++; sl = 0; }
  start();
});
$('#prev').addEventListener('click', () => {
  if (sl > 0) sl--; else if (ep > 0) { ep--; sl = EP[ep].slides.length - 1; }
  start();
});
$('#replay').addEventListener('click', start);
$('#still').addEventListener('click', () => { gen++; playing = false; syncPlay(); finalState(EP[ep].slides[sl]); });
const speeds = [1, 1.5, 2, 0.75];
$('#speed').addEventListener('click', e => { speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length]; e.currentTarget.textContent = speed + '×'; });
$('#rec').addEventListener('click', () => { location.search = `?ep=${ep + 1}&rec=1`; });
if (STUDIO) $('#rec').textContent = '录制本集';
document.querySelectorAll('[data-copy]').forEach(bt => bt.addEventListener('click', async () => {
  const el = document.getElementById(bt.dataset.copy);
  try { await navigator.clipboard.writeText(el.textContent); bt.textContent = '已复制'; }
  catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); bt.textContent = '已选中'; }
  setTimeout(() => bt.textContent = '复制', 1500);
}));
let touchX = null, touchY = null;
$('#frame').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
$('#frame').addEventListener('touchend', e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? $('#next') : $('#prev')).click();
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') $('#next').click();
  else if (e.key === 'ArrowLeft') $('#prev').click();
  else if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
});

syncPlay();
layout();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => start());
})();
</script>
</body>
